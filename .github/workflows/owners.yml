name: Fetch owners
on:
  push:
    paths: ["fetch-owners.js", ".github/workflows/owners.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  owners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node fetch-owners.js
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f vlasnici.csv vlasnici.json owners-raw || true
          git diff --cached --quiet || git commit -m "Vlasnici/posjednici [skip ci]"
          git push
