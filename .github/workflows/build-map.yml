name: Build parcel map
on:
  push:
    paths: ["fetch-parcels.js", "package.json", ".github/workflows/build-map.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node fetch-parcels.js
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f parcels.geojson map.html ko-*.zip || true
          git diff --cached --quiet || git commit -m "Build parcel map [skip ci]"
          git push
